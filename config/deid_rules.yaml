# =====================================================================================
# deid_rules.yaml — the rulebook that drives the de-identification engine.
#
# SYNTHETIC DATA ONLY. Covers TWO synthetic Epic source schemas:
#   * Caboodle (dimensional warehouse) -- 13 tables, keys `dim_*` / `fact_*` / `bridge_*`
#   * Clarity  (normalized transactional) -- 24 tables, keys `clarity_*`
# Both are de-identified by the SAME engine. Supporting a second EHR schema is a CONFIG
# change, not a code change -- that is the portability claim this file exists to prove.
# Validate against your own data + a qualified reviewer before any use on real PHI.
#
# How it works
# ------------
# A *profile* selects the overall de-id posture. Each profile has:
#   - default_strategy : applied to ANY column not explicitly listed (deny-by-default).
#   - tables           : per-table, per-column strategy + params.
#
# A column rule is either:
#   column: strategy_name                          # shorthand, no params
#   column: {strategy: name, param: value, ...}    # full form with params
#
# DENY-BY-DEFAULT: default_strategy is `suppress`, so an unclassified column is DROPPED,
# not leaked. Every kept column below is therefore a deliberate, auditable decision.
# Pipeline/lineage columns (prefixed `_`) are passed through untouched by the engine.
#
# The classification you assign in Tier 0 (catalog sensitivity labels) is the SOURCE of
# these rules — this is where "this column is PHI" becomes "so de-identify it".
# =====================================================================================

active_profile: safe_harbor

# =====================================================================================
# PRIVACY GATES — disclosure-risk controls the scorecard ENFORCES (not just reports).
#
# These three metrics quantify re-identification risk on the published gold layer. They
# are hard gates: if a threshold is not met and no acceptance is recorded below, the
# scorecard FAILS the run. That is deliberate. Re-identification risk is the thing this
# accelerator exists to manage, and a control that cannot fail is not a control.
#
# WHY AN ACCEPTANCE BLOCK EXISTS
# ------------------------------
# Some of these thresholds are unreachable on some datasets, and no amount of code fixes
# that. A patient-grain table publishing birth year and 3-digit ZIP has a quasi-identifier
# domain of ~91 x 4 x 8 x 239 = ~700k cells. Spread 50,200 patients over that and k=1 is
# arithmetic, not a bug. Measured on this repo's synthetic estate:
#
#   BirthYear + Gender + Race + ZIP3   -> 96.9% of rows sit in classes below k=5
#   10-year band + Gender + Race + ZIP3 -> 40.5%
#   AgeBand + Gender + Race + ZIP1      ->  0.6%   <-- and STILL k=1
#
# Generalization alone never reaches a k floor; there is always a tail. Real deployments
# close it with suppress_quasi_identifiers_spark(), which blanks the quasi-identifiers of
# the residual rows while KEEPING the rows, so facts in the star schema do not orphan.
#
# Your three honest options when a gate fails:
#   1. Generalize further      (coarser bands / ZIP1) -- costs analytic resolution
#   2. Suppress the tail       (suppress_quasi_identifiers_spark) -- costs a few % of cells
#   3. Accept the residual risk -- costs a signature, below, and only until it expires
#
# Option 3 is legitimate. Accepting it SILENTLY is not, which is why every field is
# required and an unedited placeholder fails the gate closed.
# =====================================================================================
# =====================================================================================
# SAFE HARBOR PRONG (ii) -- 164.514(b)(2)(ii), ACTUAL KNOWLEDGE
#
# Safe Harbor is TWO conditions, and almost every implementation ships only the first:
#   (i)  remove the 18 enumerated identifiers, AND
#   (ii) the covered entity "does not have actual knowledge that the information could be
#        used alone or in combination with other information to identify an individual who
#        is a subject of the information."
#
# No scan can establish (ii). It is a statement about what YOU know -- that the only
# paediatric transplant surgeon in a 3-digit ZIP is identifiable from specialty alone; that
# this cohort was already published elsewhere with a joinable key; that a rare diagnosis
# code names exactly one person in your population. None of that is visible to a pipeline.
#
# So this block ships UNSIGNED, and NB_scorecard FAILS any Safe Harbor claim until a named
# human fills it in. That is deliberate. Deleting eighteen columns is the part that
# automates; knowing your own data is the part that does not, and a tool reporting
# "Safe Harbor: PASS" on prong (i) alone is overstating its own evidence.
#
# NOT required for an Expert Determination claim: prong (ii) is Safe Harbor-specific,
# because the expert's risk analysis under 164.514(b)(1) already subsumes it.
# =====================================================================================
actual_knowledge:
  statement: "TODO -- state which other datasets held by this organisation were considered
    for combination with this release, which residual risks were reviewed (small cells,
    rare diagnoses, single-provider specialties, previously published extracts), and why
    the remaining data is not reasonably identifiable. Minimum 80 characters, because a
    one-line attestation is a signature on nothing."
  attested_by: "TODO -- full name of the individual attesting"
  role: "TODO -- e.g. Privacy Officer, Chief Compliance Officer"
  applies_to: "TODO -- which release/tables this attestation covers"
  attested_utc: "TODO -- YYYY-MM-DD"
  expires_utc: "TODO -- YYYY-MM-DD (actual knowledge is a statement about a MOMENT; the
    estate acquires new datasets and a sound judgement in March can be wrong by September)"

  # ---------------------------------------------------------------------------------
  # residual_risks is INFORMATIONAL: it is carried verbatim into the run manifest and the
  # scorecard JSON, and it is deliberately NOT part of defects(). Filling it in does not
  # sign anything and cannot make an unsigned attestation usable. It exists so that the
  # limits below travel with every artefact instead of living in a slide deck.
  #
  # These are the risks THIS accelerator knows about and cannot resolve for you. They are
  # pre-filled because a reviewer finding them here is better than a reviewer finding them
  # in production. Whoever signs the block above is expected to add the risks specific to
  # their own estate -- and to strike any of these that do not apply.
  # ---------------------------------------------------------------------------------
  residual_risks:
    # -- SCOPE: what this pipeline is not ------------------------------------------
    - "MODALITY SCOPE: this pipeline de-identifies structured and semi-structured data
       only -- Delta table columns, and free text within those columns. It does NOT
       process DICOM pixel data, burned-in image annotation or DICOM metadata tags;
       ambient/voice recordings (the waveform is itself a biometric identifier under
       164.514(b)(2)(i)(P)); stored biometric templates; full-face or comparable
       photographs; or scanned documents and OCR output. A PHI estate containing any of
       these needs a separate determination with separate tooling, and this run says
       nothing about it."
    - "IMAGE AND BIOMETRIC COLUMNS ARE POINTERS, NOT PAYLOADS: `FacePhotoURI` and
       `BiometricTemplateID` are suppressed, which removes the REFERENCE from the
       release. The underlying image and template stores are untouched and remain PHI.
       Scorecard checks (P) and (Q) are recorded as not_evaluated for this reason."
    - "FREE TEXT IS RULED COLUMN BY COLUMN: only the free-text fields enumerated in the
       profile are suppressed or redacted. A production Epic estate carries narrative in
       columns this rulebook has never seen, and the deny-by-default engine will halt on
       them rather than guess -- but no detector recall claim is made for the text that
       IS processed (see the withdrawn recall figure in NB_scorecard)."
    # -- LINKAGE: prong (ii) judgement calls this pipeline cannot make ---------------
    - "FACILITY GEOGRAPHY AND PROVIDER SPECIALTY SURVIVE: `dim_facility.ZIP`, `.City`,
       `.FacilityName`, `.Region` and `dim_provider.PrimarySpecialty` pass through. These
       are outside prong (i) by the letter -- they are not the individual's identifiers --
       but they are the classic linkage vector: the only paediatric transplant surgeon in
       a 3-digit ZIP identifies their patients by specialty alone. Only the covered entity
       knows its own provider density."
    - "INTERNAL RECORD IDENTIFIERS SURVIVE AS ASSIGNED CODES: `HSP_ACCOUNT_ID`,
       `HospitalAccountKey`, `COVERAGE_ID`, `PatientKey` and `PatientDurableKey` pass
       through. This is permitted under 164.514(c) because they are assigned rather than
       derived from the individual -- but ONLY for as long as the mapping is not
       disclosed. That is a custody condition on your source systems, not a property of
       this output."
    - "SURROGATE CROSSWALK CUSTODY: under a surrogate profile the crosswalk written to the
       vault workspace is the ONLY copy of the mapping. Its access control is what keeps
       the de-identification irreversible in practice; losing it loses re-identification,
       and disclosing it voids the determination."
    - "UserAgent PASSTHROUGH: `fact_portal_access.UserAgent` is retained as a device class.
       Verified on the shipped synthetic estate at 5 distinct values across 20,027 rows
       (smallest class 3,945). Real portal traffic carries high-entropy UA strings that are
       a recognised fingerprinting vector -- re-measure before retaining this column."
    # -- ESTATE: this repository's own data ------------------------------------------
    - "SYNTHETIC DEMO ESTATE: the k-anonymity, l-diversity and t-closeness gates below
       carry unsigned accepted-risk blocks that are valid only because no individual is
       represented in the shipped Tonic.ai data. Pointing this pipeline at real PHI makes
       those acceptances false statements a reviewer can see through."

privacy_gates:

  k_anonymity:
    quasi_identifiers: [BirthYear, Gender, Race, ZIP]
    k: 5
    # This repo ships against Tonic.ai-generated synthetic records. There is no real person
    # behind any equivalence class, so the residual risk is accepted for the demo estate and
    # ONLY for it. Point this pipeline at real PHI and `applies_to` is a statement a reviewer
    # can see is false -- delete this block and satisfy the gate for real.
    accepted_risk:
      reason: >-
        Synthetic demo estate: k=1 is inherent to publishing birth year and 3-digit ZIP at
        patient grain, and no individual is represented in this data. Accepted for the demo
        only; a real deployment must generalize, suppress the tail, or re-sign this.
      accepted_by: "UNSIGNED — repository default, replace before any real-PHI use"
      applies_to: "synthetic demo estate (Tonic.ai generated), 50,200 patients — NOT real PHI"
      expires_utc: "2027-08-05T00:00:00+00:00"

  l_diversity:
    sensitive_attribute: Ethnicity
    l: 2
    accepted_risk:
      reason: >-
        Synthetic demo estate: with k=1 on the quasi-identifiers, every equivalence class is
        a single row, so l=1 follows mechanically. Accepted for the demo only.
      accepted_by: "UNSIGNED — repository default, replace before any real-PHI use"
      applies_to: "synthetic demo estate (Tonic.ai generated), 50,200 patients — NOT real PHI"
      expires_utc: "2027-08-05T00:00:00+00:00"

  t_closeness:
    sensitive_attribute: Ethnicity
    t: 0.2
    accepted_risk:
      reason: >-
        Synthetic demo estate: singleton equivalence classes make the per-class Ethnicity
        distribution maximally distant from the global one by construction. Demo only.
      accepted_by: "UNSIGNED — repository default, replace before any real-PHI use"
      applies_to: "synthetic demo estate (Tonic.ai generated), 50,200 patients — NOT real PHI"
      expires_utc: "2027-08-05T00:00:00+00:00"


profiles:

  # -----------------------------------------------------------------------------------
  # SAFE HARBOR (§164.514(b)(2)): strip / generalize the 18 identifiers.
  # Dates -> year, ZIP -> 3 digits (000 for low-pop), ages 90+ capped, direct identifiers
  # tokenized or suppressed. Output is de-identified and falls OUTSIDE HIPAA.
  #
  # READ THIS BEFORE CLAIMING SAFE HARBOR. The profile name describes the *column
  # treatments* (year generalization, zip3, age capping) -- it is NOT a certification that
  # the output qualifies for a Safe Harbor claim. It does not, as shipped, because the
  # `tokenize` rules below emit values DERIVED FROM the individual (an HMAC of the MRN).
  # §164.514(c)(1) admits a re-identification code only when it is "not derived from or
  # related to information about the individual", and HHS §2.9 permits hash-derived values
  # only under EXPERT DETERMINATION, with the keys undisclosed.
  #
  # That is a deliberate trade, not an oversight: the tokens are what let the de-identified
  # Caboodle and Clarity stars still join, which is the point of the accelerator. The cost is
  # that the claimable method is expert_determination. `determination.assess_method_eligibility`
  # computes this from these rules and NB_scorecard hard-fails a mismatched claim, so removing
  # every tokenize rule below is what would make a Safe Harbor claim available again.
  # -----------------------------------------------------------------------------------
  safe_harbor:
    default_strategy: suppress

    tables:

      # ---- DimPatient: primary PHI table ------------------------------------------
      dim_patient:
        PatientKey:        passthrough                # surrogate key, not PHI
        PatientDurableKey: passthrough
        MRN:               {strategy: tokenize, namespace: mrn, prefix: "PT-"}
        FirstName:         {strategy: synthesize, kind: first_name}
        LastName:          {strategy: synthesize, kind: last_name}
        PatientName:       {strategy: synthesize, kind: name}
        DateOfBirth:       {strategy: generalize, kind: birth_year, cap_age: 90}
        Age:               {strategy: generalize, kind: age_cap, cap: 90}
        AgeBand:           passthrough                # already generalized in silver
        Gender:            passthrough
        Race:              passthrough
        Ethnicity:         passthrough
        ZIP:               {strategy: generalize, kind: zip3}
        # --- direct identifiers carried on DimPatient (docs/safe_harbor_mapping.md) ---
        AddressLine1:         suppress               # (B) street address
        City:                 suppress               # (B) geography finer than state
        StateAbbr:            passthrough            # (B) STATE is expressly permitted
        HomePhone:            suppress               # (D) telephone number
        MobilePhone:          suppress               # (D) telephone number
        Email:                suppress               # (F) email address
        SSN:                  suppress               # (G) social security number
        DriversLicenseNumber: suppress               # (L) certificate/licence number
        HealthPlanMemberID:   suppress               # (H) health plan beneficiary number
        BiometricTemplateID:  suppress               # (P) biometric identifier
        FacePhotoURI:         suppress               # (Q) full-face photograph
        PCPProviderKey:    passthrough                # surrogate FK
        EffectiveDate:     passthrough                # SCD record-mgmt date, not a care event
        ExpirationDate:    passthrough

      # ---- DimProvider: NPI + names identify the provider (optional; disable if not needed)
      dim_provider:
        ProviderKey:        passthrough
        ProviderDurableKey: passthrough
        NPI:                {strategy: tokenize, namespace: npi, prefix: "NP-"}
        ProviderName:       {strategy: synthesize, kind: name}
        FirstName:          {strategy: synthesize, kind: first_name}
        LastName:           {strategy: synthesize, kind: last_name}
        ProviderFullName:   {strategy: synthesize, kind: name}   # derived in silver
        Credentials:        passthrough
        Gender:             passthrough
        ProviderType:       passthrough
        IsProviderActive:   passthrough
        PrimarySpecialty:   passthrough
        ProviderStatus:     passthrough
        HireDate:           passthrough                # provider employment, not patient PHI
        TerminationDate:    passthrough
        IsActive:           passthrough                # derived in silver
        EffectiveDate:      passthrough
        ExpirationDate:     passthrough

      # ---- DimProviderCredential: license/DEA numbers are direct identifiers -------
      dim_provider_credential:
        ProviderCredentialKey:   passthrough
        ProviderKey:             passthrough
        ProviderDurableKey:      passthrough
        LicenseNumber:           {strategy: tokenize, namespace: license, prefix: "LIC-"}
        LicenseState:            passthrough
        DEANumber:               {strategy: tokenize, namespace: dea, prefix: "DEA-"}
        BoardCertification:      passthrough
        LicenseExpirationDate:   passthrough
        DEAExpirationDate:       passthrough
        BoardCertExpirationDate: passthrough
        EffectiveDate:           passthrough
        ExpirationDate:          passthrough

      # ---- DimFacility: street address is an identifier; facility (org) ZIP is fine --
      dim_facility:
        FacilityKey:        passthrough
        FacilityDurableKey: passthrough
        FacilityID:         passthrough
        FacilityName:       passthrough
        AddressLine1:       suppress                   # street address = identifier
        City:               passthrough
        StateAbbr:          passthrough
        ZIP:                passthrough                # facility (org) geography, not patient
        Region:             passthrough
        EffectiveDate:      passthrough
        ExpirationDate:     passthrough

      # ---- Facts: keep keys/measures; generalize care dates to year; drop month ------
      fact_claim:
        ClaimKey:               passthrough
        PatientKey:             passthrough
        BillingProviderKey:     passthrough
        RenderingProviderKey:   passthrough
        PayerKey:               passthrough
        ProcedureKey:           passthrough
        DiagnosisKey:           passthrough
        ServiceDate:            {strategy: generalize, kind: year}
        BilledAmount:           passthrough
        AllowedAmount:          passthrough
        PaidAmount:             passthrough
        ClaimStatus:            passthrough
        DeniedFlag:             passthrough
        AllowedVariance:        passthrough
        PatientResponsibility:  passthrough
        ServiceYear:            passthrough            # already year-grain
        ServiceMonth:           suppress               # yyyy-MM too granular for Safe Harbor

      fact_encounter:
        EncounterKey:          passthrough
        PatientKey:            passthrough
        AttendingProviderKey:  passthrough
        ReferringProviderKey:  passthrough
        DepartmentKey:         passthrough
        LocationKey:           passthrough
        DiagnosisKey:          passthrough
        EncounterDate:         {strategy: generalize, kind: year}
        EncounterType:         passthrough
        LengthOfStay:          passthrough
        EncounterYear:         passthrough
        EncounterMonth:        suppress
        # FREE TEXT: identifiers hide *inside* narrative, so column-level rules are not enough.
        # redact_text runs NER (Presidio when installed, regex otherwise) and replaces each
        # detected span with its entity label. Set replacement: token to keep linkage instead.
        ReasonForVisitNote:    {strategy: redact_text, replacement: label, namespace: encounter_note}

      fact_risk_score:
        RiskScoreKey: passthrough
        PatientKey:   passthrough
        ProviderKey:  passthrough
        RiskModel:    passthrough
        RiskScore:    passthrough
        ScoreDate:    {strategy: generalize, kind: year}

      # ---- DimHospitalAccount: (E) account numbers + GUARANTOR contact --------------
      # 164.514(b)(2)(i) reaches identifiers "of relatives, employers, or household
      # members of the individual", so the guarantor's name, phone and fax are in scope
      # exactly as the patient's own are. This is the clause people most often miss.
      dim_hospital_account:
        HospitalAccountKey:     passthrough          # warehouse surrogate, not the account no.
        PatientKey:             passthrough
        HospitalAccountNumber:  suppress             # (E) account number
        GuarantorAccountNumber: suppress             # (E) account number
        GuarantorName:          suppress             # (A) name of a relative
        GuarantorRelationship:  passthrough          # "Spouse"/"Guardian" is not identifying
        GuarantorPhone:         suppress             # (D) telephone number
        GuarantorFaxNumber:     suppress             # (E) fax number
        AccountClass:           passthrough
        AccountStatus:          passthrough
        OpenDate:               {strategy: generalize, kind: year}
        CloseDate:              {strategy: generalize, kind: year}
        TotalCharges:           passthrough

      # ---- FactPatientDevice: (M) device identifiers and serial numbers -------------
      fact_patient_device:
        PatientDeviceKey: passthrough
        PatientKey:       passthrough
        DeviceType:       passthrough
        Manufacturer:     passthrough
        ModelNumber:      passthrough                # a model is shared by many devices
        SerialNumber:     suppress                   # (M) device serial number
        UDI:              suppress                   # (M) the UDI embeds the serial number
        ImplantDate:      {strategy: generalize, kind: year}
        DeviceStatus:     passthrough

      # ---- FactPortalAccess: (N) URLs and (O) IP addresses -------------------------
      fact_portal_access:
        PortalAccessKey: passthrough
        PatientKey:      passthrough
        AccessDate:      {strategy: generalize, kind: year}
        PortalUserName:  suppress                    # (C)/(R) account handle
        SourceIPAddress: suppress                    # (O) IP address
        AccessedURL:     suppress                    # (N) URL, and it embeds the patient id
        UserAgent:       passthrough                 # device class, shared by millions
        SessionID:       suppress                    # (R) other unique identifying code

      # ---- FactPatientTransport: (J) vehicle identifiers ---------------------------
      fact_patient_transport:
        TransportKey:                passthrough
        PatientKey:                  passthrough
        TransportDate:               {strategy: generalize, kind: year}
        TransportMode:               passthrough
        TransportAgency:             passthrough
        VehicleIdentificationNumber: suppress        # (J) vehicle identifier / VIN
        LicensePlateNumber:          suppress        # (J) licence plate number
        ArrivalMinutes:              passthrough

      # ===================================================================================
      # EPIC CLARITY — the normalized, transactional source most Epic shops land first.
      # Same engine, same strategies; only names differ. Two things make Clarity a harder
      # (and therefore better) test than Caboodle:
      #   1. PAT_ID is a REAL identifier, not a surrogate key, and it is the join column in
      #      seven tables -> tokenizing it consistently is what keeps the source joinable.
      #   2. PAT_ENC_CSN_ID (contact serial number) is visible on paperwork and in the UI,
      #      so it is treated as identifier #18 and tokenized -- unlike Caboodle's purely
      #      internal EncounterKey, which is passed through.
      # ===================================================================================

      # ---- PATIENT: Clarity's primary PHI table -------------------------------------
      clarity_patient:
        PAT_ID:            {strategy: tokenize, namespace: pat_id, prefix: "EP-"}
        PAT_MRN_ID:        {strategy: tokenize, namespace: mrn, prefix: "PT-"}
        PAT_NAME:          {strategy: synthesize, kind: name}
        PAT_FIRST_NAME:    {strategy: synthesize, kind: first_name}
        PAT_LAST_NAME:     {strategy: synthesize, kind: last_name}
        BIRTH_DATE:        {strategy: generalize, kind: birth_year, cap_age: 90}
        SEX_C:             passthrough              # ZC_SEX code, not identifying
        MARITAL_STATUS_C:  passthrough
        PAT_STATUS_C:      passthrough
        DEATH_DATE:        {strategy: generalize, kind: year}   # date of death -> year
        CITY:              suppress                 # geography finer than state
        STATE_C_NAME:      passthrough              # state IS permitted under Safe Harbor
        ZIP:               {strategy: generalize, kind: zip3}
        HOME_PHONE:        suppress                 # identifier #4
        SSN:               suppress                 # identifier (G)
        WORK_PHONE:        suppress                 # identifier (D)
        MOBILE_PHONE:      suppress                 # identifier (D)
        EMAIL_ADDRESS:     suppress                 # identifier #6
        ADD_LINE_1:        suppress                 # street address
        AGE:               {strategy: generalize, kind: age_cap, cap: 90}   # derived in silver
        AGE_BAND:          passthrough              # already generalized in silver

      # ---- COVERAGE: (H) plan beneficiary numbers; the subscriber is often a relative
      clarity_coverage:
        COVERAGE_ID:       passthrough
        PAT_ID:            {strategy: tokenize, namespace: pat_id, prefix: "EP-"}
        PAYOR_ID:          passthrough
        PLAN_NAME:         passthrough
        SUBSCRIBER_ID:     suppress                 # (H) health plan beneficiary number
        GROUP_NUM:         suppress                 # (H) plan group number
        SUBSCRIBER_NAME:   suppress                 # (A) name, frequently a relative
        SUBSCRIBER_REL_C:  passthrough
        MEM_EFF_FROM_DATE: {strategy: generalize, kind: year}
        MEM_EFF_TO_DATE:   {strategy: generalize, kind: year}

      # ---- HSP_ACCOUNT: (E) account numbers + guarantor contact --------------------
      clarity_hsp_account:
        HSP_ACCOUNT_ID:   passthrough
        PAT_ID:           {strategy: tokenize, namespace: pat_id, prefix: "EP-"}
        ACCT_BILLING_NUM: suppress                  # (E) account number
        GUAR_NAME:        suppress                  # (A) name of a relative
        GUAR_HOME_PHONE:  suppress                  # (D) telephone number
        GUAR_FAX:         suppress                  # (E) fax number
        ACCT_CLASS_HA_C:  passthrough
        ACCT_STATUS:      passthrough
        ADM_DATE_TIME:    {strategy: generalize, kind: year}
        DISCH_DATE_TIME:  {strategy: generalize, kind: year}
        TOT_CHGS:         passthrough

      # ---- PAT_ENC: one row per patient contact --------------------------------------
      clarity_pat_enc:
        PAT_ENC_CSN_ID:  {strategy: tokenize, namespace: csn, prefix: "ENC-"}
        PAT_ID:          {strategy: tokenize, namespace: pat_id, prefix: "EP-"}
        PAT_ENC_DATE:    {strategy: generalize, kind: year}
        CONTACT_DATE:    {strategy: generalize, kind: year}
        ENC_TYPE_C:      passthrough
        APPT_STATUS_C:   passthrough
        DEPARTMENT_ID:   passthrough
        VISIT_PROV_ID:   passthrough               # provider, not patient
        ENC_CLOSED_YN:   passthrough
        ENC_YEAR:        passthrough               # derived in silver, already year-grain
        ENC_MONTH:       suppress                  # yyyy-MM too granular for Safe Harbor

      # ---- PAT_ENC_HSP: inpatient admit/discharge -------------------------------------
      clarity_pat_enc_hsp:
        PAT_ENC_CSN_ID:    {strategy: tokenize, namespace: csn, prefix: "ENC-"}
        PAT_ID:            {strategy: tokenize, namespace: pat_id, prefix: "EP-"}
        ADT_PAT_CLASS:     passthrough
        HOSP_ADMSN_TIME:   {strategy: generalize, kind: year}   # admission date -> year
        HOSP_DISCH_TIME:   {strategy: generalize, kind: year}   # discharge date -> year
        ADMIT_SOURCE_C:    passthrough
        DISCH_DISP_C:      passthrough
        DEPARTMENT_ID:     passthrough
        ADMISSION_PROV_ID: passthrough
        LOS_DAYS:          passthrough              # interval, not a calendar date

      # ---- PAT_ENC_DX: encounter diagnoses --------------------------------------------
      clarity_pat_enc_dx:
        PAT_ENC_CSN_ID: {strategy: tokenize, namespace: csn, prefix: "ENC-"}
        PAT_ID:         {strategy: tokenize, namespace: pat_id, prefix: "EP-"}
        LINE:           passthrough
        CONTACT_DATE:   {strategy: generalize, kind: year}
        DX_ID:          passthrough
        PRIMARY_DX_YN:  passthrough
        DX_ED_YN_C:     passthrough

      # ---- ORDER_MED / ORDER_PROC / ORDER_RESULTS: order + result grain ---------------
      # Order IDs are tokenized for the SAME reason PAT_ENC_CSN_ID is: they are printed on
      # medication labels and lab requisitions/result reports, so they are a direct linkage
      # path back to the source system for anyone holding a piece of paper. Tokenizing in a
      # stable namespace preserves the order_proc <-> order_results join. As a bonus this
      # keeps 9-digit numeric Clarity IDs (VARCHAR in Epic) out of the residual-PHI gate,
      # where a bare run of 9 digits is indistinguishable from an SSN.
      clarity_order_med:
